# Opt-in BigQuery access; combine with compose.yaml after local Google sign-in.
x-bigquery: &bigquery
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/google-adc.json
    # One platform-wide target; DAG configs do not select a project.
    GOOGLE_CLOUD_PROJECT: healthy-pager-398915
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type":"google_cloud_platform"}'
    BIGQUERY_LOCATION: EU
  volumes:
    - type: bind
      source: ./secrets
      target: /opt/airflow/secrets
      read_only: true
      bind:
        create_host_path: false

services:
  airflow-api-server:
    <<: *bigquery
  airflow-scheduler:
    <<: *bigquery
  airflow-dag-processor:
    <<: *bigquery
