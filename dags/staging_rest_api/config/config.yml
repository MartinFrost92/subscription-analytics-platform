dag_defaults:
  description: 'This is a placeholder DAG for the REST API staging.'
  default_args:
    owner: 'Martin Frost Hamann'
  schedule: "0 5 * * *"
  start_date: "2026-10-26"
  catchup: false
  tags:
    - 'REST API'

project_id: 'healthy-pager-398915'

datasets:
  staging: 'staging'
  transform: 'transform'
  model: 'model'
  utilities: 'utilities'

connection_id: 'synthetic_api'
end_points:
  - {
      'name': 'customers', 
      'request': 'GET', 
      'path': 'customers', 
      'detail_path': 'customers/{id}',
    }
  - {
      'name': 'subscriptions', 
      'request': 'GET', 
      'path': 'subscriptions', 
      'detail_path': 'subscriptions/{id}'
    } 
  - {
      'name': 'invoices', 
      'request': 'GET', 
      'path': 'invoices', 
      'detail_path': 'invoices/{id}',
      'pagination': {
        'strategy': 'page',
        'identifier': 'page',
        'params':
          {'page_size': 1000}
        }
    }
